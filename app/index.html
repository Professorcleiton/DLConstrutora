<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL Construtora – App da Obra</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/jpeg" href="../img/DLOGO.jpg">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 16px; max-width: 560px; margin: auto; color: #1f2937; background: #f9fafb; }
    h2 { margin: 8px 0 16px; }
    .hidden { display: none !important; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-top: 12px; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; background: #fff; }
    button { padding: 12px; cursor: pointer; border: none; border-radius: 8px; font-size: 15px; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .btn-primario { background: #2563eb; color: #fff; width: 100%; margin-top: 12px; }
    .btn-sair { background: #e5e7eb; }
    .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .topo small { color: #6b7280; overflow: hidden; text-overflow: ellipsis; }
    .abas { display: flex; gap: 8px; margin: 12px 0 16px; }
    .abas button { flex: 1; background: #e5e7eb; }
    .abas button.ativa { background: #1f2937; color: #fff; }
    .destino-botoes { display: flex; gap: 12px; margin-top: 12px; }
    .destino-botoes button { flex: 1; padding: 18px 10px; font-size: 15px; color: #fff; }
    .btn-obra { background: #2563eb; }
    .btn-redes { background: #f59e0b; }
    #preview img, #preview video { max-width: 100%; max-height: 260px; border-radius: 8px; margin-top: 8px; }
    .percentual-linha { display: flex; gap: 10px; align-items: center; }
    .percentual-linha input[type=range] { flex: 1; }
    .percentual-linha input[type=number] { width: 80px; }
    .etapa-linha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #f3f4f6; }
    .etapa-linha input { flex: 1 1 100%; margin: 0; }
    .etapa-linha select { flex: 1; margin: 0; }
    .etapa-linha button { padding: 8px 10px; background: #f3f4f6; }
    .btn-secundario { background: #f3f4f6; width: 100%; margin-top: 6px; }
    .status { margin-top: 12px; font-weight: 600; }
    .ok { color: #15803d; } .erro { color: #b91c1c; } .info { color: #374151; }
    .link-site { font-size: 14px; display: inline-block; margin-top: 8px; }
  </style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="tela-login" class="card">
  <h2>Entrar</h2>
  <form id="formLogin">
    <input type="email" id="email" placeholder="E-mail" autocomplete="username" required>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
    <button type="submit" class="btn-primario">Entrar</button>
  </form>
  <p id="erro-login" class="status erro"></p>
</div>

<!-- ============ APP ============ -->
<div id="tela-app" class="hidden">
  <div class="topo">
    <small id="usuarioLogado"></small>
    <button class="btn-sair" id="btnSair">Sair</button>
  </div>

  <div class="abas">
    <button data-aba="aba-envio" class="ativa">📷 Enviar mídia</button>
    <button data-aba="aba-obras">🏗️ Gerenciar obras</button>
  </div>

  <!-- ---------- ENVIAR MÍDIA ---------- -->
  <div id="aba-envio" class="card">
    <label for="obraEnvio">Obra</label>
    <select id="obraEnvio"></select>

    <label for="arquivo">Foto ou vídeo</label>
    <input type="file" id="arquivo" accept="image/*,video/*">
    <div id="preview"></div>

    <label for="legenda">Legenda (opcional)</label>
    <textarea id="legenda" rows="2"></textarea>

    <label for="categoria">Categoria (opcional)</label>
    <select id="categoria">
      <option value="">--</option>
      <option value="estrutura">Estrutura</option>
      <option value="acabamento">Acabamento</option>
      <option value="instalacao">Instalação</option>
      <option value="antes-depois">Antes/Depois</option>
    </select>

    <p><strong>O que fazer com esta mídia?</strong></p>
    <div class="destino-botoes">
      <button class="btn-obra" data-destino="obra">🏗️ Publicar em Acompanhar Obra</button>
      <button class="btn-redes" data-destino="redes">📱 Enviar para Redes Sociais</button>
    </div>
    <p id="statusEnvio" class="status"></p>
  </div>

  <!-- ---------- GERENCIAR OBRAS ---------- -->
  <div id="aba-obras" class="card hidden">
    <label for="obraEditar">Escolha a obra</label>
    <select id="obraEditar"></select>

    <form id="formObra">
      <div id="campoCodigo">
        <label for="obraCodigo">Código (ex: CDO-2026-003)</label>
        <input type="text" id="obraCodigo" style="text-transform: uppercase;" required>
      </div>

      <label for="obraNome">Nome da obra</label>
      <input type="text" id="obraNome" required>

      <label for="obraEndereco">Endereço</label>
      <input type="text" id="obraEndereco">

      <label for="obraPercentualNum">Percentual concluído</label>
      <div class="percentual-linha">
        <input type="range" id="obraPercentualRange" min="0" max="100" step="1">
        <input type="number" id="obraPercentualNum" min="0" max="100" step="1" required>
      </div>

      <label>Etapas</label>
      <div id="listaEtapas"></div>
      <button type="button" class="btn-secundario" id="btnAddEtapa">+ Adicionar etapa</button>

      <button type="submit" class="btn-primario">💾 Salvar obra</button>
    </form>
    <a id="linkSite" class="link-site hidden" target="_blank" rel="noopener">Ver como o cliente vê ↗</a>
    <p id="statusObra" class="status"></p>
  </div>
</div>

<script type="module" src="./app.js?v=3"></script>
</body>
</html>
